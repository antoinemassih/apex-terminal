# docs/migration/baselines.toml
# Style-migration ratchet baselines — captured 2026-06-13 on branch sidebar-nav.
#
# Each value is the COUNT of the corresponding pattern found in the live tree at
# the time Stream S0 (Guardrails & CI lints) landed.  The lint script
# (scripts/style-mig-lint.sh) asserts that live counts are <= these values.
#
# HOW TO LOWER A BASELINE
#   After a migration stream removes occurrences of a pattern, recount, edit
#   this file, and commit it alongside the removals.  The CI lint will then
#   enforce the new, lower ceiling.  See docs/migration/README.md for the
#   full workflow.
#
# HOW TO HARD-BAN A PATTERN
#   When a pattern is fully eradicated (count reaches 0), set the value to 0.
#   The lint will then fail on the very first new occurrence — it becomes a
#   hard ban rather than a ratchet.  Update the comment in the lint script
#   for that check to say "hard-ban" and remove the <= language.

# ── Check 1 ───────────────────────────────────────────────────────────────────
# Number of `pub <field>:` lines inside the `StyleSettings` struct in
# src-tauri/src/chart/renderer/ui/style.rs.
# Ratchet direction: DOWN (remove deprecated fields, never add new ones).
#
# Captured field list (99 fields):
#   r_xs, r_sm, r_md, r_lg, r_pill, serif_headlines, button_treatment,
#   hairline_borders, stroke_hair, stroke_thin, stroke_std, stroke_bold,
#   stroke_thick, shadows_enabled, solid_active_fills, invert_active_fill,
#   uppercase_section_labels, label_letter_spacing_px, toolbar_height_scale,
#   header_height_scale, font_hero, vertical_group_dividers,
#   show_active_tab_underline, active_header_fill_multiply,
#   inactive_header_fill_multiply, inactive_header_fill,
#   header_outer_border_alpha, header_outer_border_width, header_divider_alpha,
#   account_strip_height, pane_border_width, pane_gap, card_padding_y,
#   card_padding_x, row_height_px, button_height_px, button_padding_x,
#   tab_height, font_section_label, font_body, font_caption, hover_bg_alpha,
#   active_bg_alpha, focus_ring_width, focus_ring_alpha, disabled_opacity,
#   shadow_blur, shadow_offset_y, shadow_alpha, density, accent_emphasis,
#   nav_letter_spacing_px, nav_buttons_label_only, nav_buttons_uppercase_labels,
#   tab_underline_thickness, tab_underline_under_text, card_floating_shadow,
#   card_floating_shadow_alpha, cta_height_px, cta_padding_x, pane_gap_alpha,
#   pane_active_indicator, nav_active_col_alpha, dialog_backdrop_alpha,
#   tab_inactive_alpha, tab_hover_bg_alpha, section_label_padding_top,
#   section_label_padding_bottom, pane_active_fill_accent, pane_gap_color,
#   drag_handle_alpha, drag_handle_dot_scale, toast_bg_alpha, card_stripe_alpha,
#   r_chip, wl_row_side_margin, wl_row_corner_radius, wl_row_divider_alpha,
#   wl_symbol_mono, section_header_mono, section_header_tracking,
#   panel_tab_treatment, animations_enabled, surface_bevel,
#   bevel_highlight_alpha, bevel_shadow_alpha, region_gap, region_radius,
#   region_border_alpha, nav_cluster_radius, nav_cluster_fill_alpha,
#   nav_cluster_padding, button_group, toolnav_height, footer_default_open,
#   panel_header_treatment, panel_section_fill_alpha, panel_footer_card,
#   panel_footer_radius
#   pane_header_compact_adjust
#
# Raised 99 -> 100 for `pane_header_compact_adjust`, added by 58428919 ("pane
# header: per-style behaviour moves from a style-INDEX match into the style").
# That is a legitimate field — it is the same class of fix the audit ledger
# records repeatedly, replacing a fragile match on style INDEX with a value the
# style itself carries — and the baseline was simply never raised with it.
#
# So this gate has been RED on every branch carrying that commit since
# 2026-08-16, which is also why `Design System Lint` was failing in CI while
# every gate run locally reported green: the local runs did not include
# `style-mig-lint.sh`.
style_settings_pub_fields = 100

