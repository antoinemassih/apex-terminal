name: Quality Gates

# Audit remediation gates (WS-B). Three CI-runnable checks that stop the
# codebase from regressing while the WS-C..G work lands:
#   • quality-ratchet — dev/quality_gate.py: unwrap budget / file-size ceiling /
#     dead-code / command-bus-bypass counts (fail-on-increase).
#   • clippy-deny     — the [lints.clippy] deny table (todo/unimplemented/
#     dbg_macro must stay at zero in a live-money app).
#   • build-matrix    — the app must compile on all three feature configs, not
#     just the default one, so the legacy render path and design-mode don't rot.
#   • unit-tests      — the FULL `cargo test --lib` suite (W0-13). Previously CI
#     only compile-checked the lib; the ~800 unit tests (incl. the trading
#     money-path suite) never ran, so a logic regression could merge green.
#
# NOT here (by design): the 1,065-scenario corpus gate and the ux_audit gate.
# Both drive the REAL windowed GPU app + the debug-only dev_inspector HTTP
# server, which a headless ubuntu runner cannot host. They run as a local /
# self-hosted pre-merge gate — see scripts/corpus_gate.sh.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality-ratchet:
    name: Ratchets (unwrap / size / dead-code / bus-bypass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run quality ratchets
        run: python dev/quality_gate.py

  clippy-deny:
    name: Clippy deny table (no todo!/unimplemented!/dbg!)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system deps (Tauri/wgpu build prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev
      - name: Create placeholder sidecar binaries (for tauri-build)
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/ococo-api-aarch64-apple-darwin
          touch src-tauri/binaries/ococo-api-x86_64-pc-windows-msvc.exe
          touch src-tauri/binaries/ococo-api-x86_64-unknown-linux-gnu
      # This job enforces ONLY the restriction lints from the [lints.clippy]
      # table (todo / unimplemented / dbg_macro = deny; unwrap/expect = warn).
      # `-A clippy::all` silences clippy's default-deny CORRECTNESS/suspicious
      # group so this job does not fail on pre-existing correctness debt
      # (invisible-unicode, raw-ptr-deref, bad deprecated-semver — that debt is
      # connectivity-ci.yml's scope). Crucially, todo/unimplemented/dbg_macro/
      # unwrap are `restriction` lints, NOT part of clippy::all, so `-A
      # clippy::all` does not touch them — the table's deny/warn levels survive
      # and this job still ERRORS if a todo!()/dbg!() reappears. No `-D warnings`
      # (that would promote the ~670 grandfathered unwrap warns to errors).
      - name: cargo clippy (deny table — no todo!/unimplemented!/dbg!)
        working-directory: src-tauri
        run: cargo clippy --lib --no-deps -- -A clippy::all

  build-matrix:
    name: Build matrix (default / no-default-features / design-mode)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
            allow_fail: false
          - name: no-default-features (legacy egui render path)
            flags: "--no-default-features"
            allow_fail: false
          # design-mode was bit-rotted (caught by this very gate on WS-B) and
          # REPAIRED in the same workstream: the toml optional dep was misfiled
          # under the macOS-only target section (so dep:toml never activated on
          # Windows/Linux); THEMES is now compiled under design-mode too; the
          # obsolete accent_alts editor was removed; AlphaTokens.scrim restored.
          # Now blocking again — a future regression must fail CI.
          - name: design-mode (design_inspector, non-default)
            flags: "--features design-mode"
            allow_fail: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system deps (Tauri/wgpu build prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev
      - name: Create placeholder sidecar binaries (for tauri-build)
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/ococo-api-aarch64-apple-darwin
          touch src-tauri/binaries/ococo-api-x86_64-pc-windows-msvc.exe
          touch src-tauri/binaries/ococo-api-x86_64-unknown-linux-gnu
      - name: cargo check --lib ${{ matrix.flags }}
        working-directory: src-tauri
        continue-on-error: ${{ matrix.allow_fail }}
        run: cargo check --lib ${{ matrix.flags }}

  # W0-13 (audit): run the FULL unit-test suite on every push. CI previously
  # only `cargo check`ed the lib (compile, no tests) — the ~800 unit tests
  # (incl. the trading money-path suite) never ran in CI, so a logic regression
  # in order_manager / reconcile / risk could merge green. This runs them all.
  unit-tests:
    name: Unit tests (cargo test --lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system deps (Tauri/wgpu build prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev
      - name: Create placeholder sidecar binaries (for tauri-build)
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/ococo-api-aarch64-apple-darwin
          touch src-tauri/binaries/ococo-api-x86_64-pc-windows-msvc.exe
          touch src-tauri/binaries/ococo-api-x86_64-unknown-linux-gnu
      - name: cargo test --lib
        working-directory: src-tauri
        # The full suite. #[ignore]'d tests (process-global env races) are NOT
        # run here — they pass in isolation via `-- --ignored` and would flake
        # under CI parallelism.
        run: cargo test --lib

  # AUDIT 2026-08-02 (W2): CI never compiled the artifact this project SHIPS.
  #
  # Every other job above is `--lib`, debug, ubuntu-only. That leaves three
  # whole surfaces permanently unverified:
  #   • both [[bin]] targets — `apex-native` (src/native_main.rs, the actual
  #     desktop app) and `apex-playground`. A type error in either could merge
  #     green forever, because nothing built them.
  #   • the release profile — different codegen, different lints, and the
  #     `CountingAlloc` global allocator is release-gated.
  #   • all 30 `cfg(windows)` / `cfg(target_os = "windows")` sites. The product
  #     ships on Windows; ubuntu-latest compiles the *other* arm of every one
  #     of those conditionals, so Windows-only code was never type-checked.
  #
  # This job closes all three. It runs on windows-latest, builds the bins, and
  # needs no GPU or display — compiling wgpu/winit does not require a device.
  shipping-binary:
    name: Shipping binary (windows, --bins)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Create placeholder sidecar binaries (for tauri-build)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/ococo-api-aarch64-apple-darwin
          touch src-tauri/binaries/ococo-api-x86_64-pc-windows-msvc.exe
          touch src-tauri/binaries/ococo-api-x86_64-unknown-linux-gnu
      # `check` first: it surfaces every type error in the bins and in the
      # cfg(windows) arms in a fraction of the time a full build takes, so a
      # broken Windows path fails fast instead of after a long link.
      - name: cargo check --bins (windows cfg arms + both bin targets)
        working-directory: src-tauri
        run: cargo check --bins
      # Then the real thing. Release codegen is where the allocator and any
      # opt-level-dependent breakage actually shows up.
      - name: cargo build --release --bins
        working-directory: src-tauri
        run: cargo build --release --bins
