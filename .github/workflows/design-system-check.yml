name: Design System Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  design-system-check:
    name: Check for raw egui primitives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/check-design-system.sh scripts/style-mig-lint.sh scripts/sx_ratchet.sh scripts/recipe_adoption_gate.sh

      - name: Run design-system ratchet (per-file budgets)
        run: scripts/check-design-system.sh

      # M0.8: the other two gates existed but never ran in CI, which made them
      # decorative. All three design gates now run on every push/PR.
      - name: Run style-migration lints (baselines.toml ratchets)
        if: ${{ !cancelled() }}
        run: bash scripts/style-mig-lint.sh

      - name: Run legacy-tone ratchet + Sx adoption floor
        if: ${{ !cancelled() }}
        run: bash scripts/sx_ratchet.sh

      # M3.6: the metric the architecture audit said never existed — FLOORS for
      # recipe-layer adoption (widgets consulting, keys authored, styles with
      # data). The other gates are ceilings on bad patterns; this one guards
      # against the design system quietly going dormant again.
      - name: Run recipe-adoption gate (floors)
        if: ${{ !cancelled() }}
        run: bash scripts/recipe_adoption_gate.sh

      # M5: the AST-ish pass for the leak check-design-system.sh documents that
      # it CANNOT see — the positional corner-radius argument of painter calls.
      # 139 gated sites (0.0 = square is excluded; that is the design, not a
      # leak), 84 of them inside the sacred core.rs.
      - name: Run radius lint (positional corner-radius literals)
        if: ${{ !cancelled() }}
        run: python scripts/radius_lint.py

      # The RELATIONSHIP gate. Every other check here asks "is this value a
      # token?" — which cannot see three siblings using three different legal
      # tokens and rendering three different heights. This one bans the form
      # that can never participate in a relationship at all: a control height
      # written as a bare number.
      - name: Run control-size lint (literal control heights)
        if: ${{ !cancelled() }}
        run: python scripts/control_size_lint.py

      # The CONSUMPTION gate. The lints above ask "is this value a token?".
      # This one asks the opposite and previously-unasked question: "does
      # anything READ this token?"
      #
      # It exists because new token defaults are deliberately set equal to the
      # literal they replace, so an unauthored style renders byte-identically —
      # which means nothing moves when a token IS wired and nothing breaks when
      # it ISN'T. `splitter_width` shipped with zero consumers behind a comment
      # defending the literal; `row_height_comfortable` had none for four days
      # after its milestone was marked complete. No compiler or test can see
      # that. Only a call-site count can.
      - name: Run token-consumer gate (authorable but unread tokens)
        if: ${{ !cancelled() }}
        run: python dev/token_consumer_gate.py

      # The SINGULARITY gate. Every check above polices values INSIDE the design
      # system. This one polices how many design systems there are.
      #
      # Eight overlapping ways to answer "what colour/size should this be?" had
      # accumulated, because each new one was added beside the last rather than
      # in place of it, and nothing ever failed for having two. `sx::recipes`
      # was a complete second recipe engine whose only consumer was a settings
      # gallery captioned "proof the new styling system is wired into the app".
      #
      # Deleting it is not durable on its own — only a census that objects when
      # it grows back is. Legacy systems are ceilings (may shrink, never grow),
      # canonical ones are floors (a migration is not finished by abandoning
      # the destination), deleted ones must stay at zero.
      - name: Run single-system gate (parallel styling systems)
        if: ${{ !cancelled() }}
        run: python dev/single_system_gate.py
