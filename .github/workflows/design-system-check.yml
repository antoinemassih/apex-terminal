name: Design System Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  design-system-check:
    name: Check for raw egui primitives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/check-design-system.sh scripts/style-mig-lint.sh scripts/sx_ratchet.sh scripts/recipe_adoption_gate.sh

      - name: Run design-system ratchet (per-file budgets)
        run: scripts/check-design-system.sh

      # M0.8: the other two gates existed but never ran in CI, which made them
      # decorative. All three design gates now run on every push/PR.
      - name: Run style-migration lints (baselines.toml ratchets)
        if: ${{ !cancelled() }}
        run: bash scripts/style-mig-lint.sh

      - name: Run legacy-tone ratchet + Sx adoption floor
        if: ${{ !cancelled() }}
        run: bash scripts/sx_ratchet.sh

      # M3.6: the metric the architecture audit said never existed — FLOORS for
      # recipe-layer adoption (widgets consulting, keys authored, styles with
      # data). The other gates are ceilings on bad patterns; this one guards
      # against the design system quietly going dormant again.
      - name: Run recipe-adoption gate (floors)
        if: ${{ !cancelled() }}
        run: bash scripts/recipe_adoption_gate.sh

      # M5: the AST-ish pass for the leak check-design-system.sh documents that
      # it CANNOT see — the positional corner-radius argument of painter calls.
      # 139 gated sites (0.0 = square is excluded; that is the design, not a
      # leak), 84 of them inside the sacred core.rs.
      - name: Run radius lint (positional corner-radius literals)
        if: ${{ !cancelled() }}
        run: python scripts/radius_lint.py

      # The RELATIONSHIP gate. Every other check here asks "is this value a
      # token?" — which cannot see three siblings using three different legal
      # tokens and rendering three different heights. This one bans the form
      # that can never participate in a relationship at all: a control height
      # written as a bare number.
      - name: Run control-size lint (literal control heights)
        if: ${{ !cancelled() }}
        run: python scripts/control_size_lint.py

      # The CONSUMPTION gate. The lints above ask "is this value a token?".
      # This one asks the opposite and previously-unasked question: "does
      # anything READ this token?"
      #
      # It exists because new token defaults are deliberately set equal to the
      # literal they replace, so an unauthored style renders byte-identically —
      # which means nothing moves when a token IS wired and nothing breaks when
      # it ISN'T. `splitter_width` shipped with zero consumers behind a comment
      # defending the literal; `row_height_comfortable` had none for four days
      # after its milestone was marked complete. No compiler or test can see
      # that. Only a call-site count can.
      # Covers TWO layers: `ui_kit::style` accessors, and `StyleSystem` fields —
      # the layer a theme author actually edits. A field there can be authored,
      # exported, re-imported and round-trip asserted while nothing reads it;
      # the round-trip proves the value SURVIVES, not that it does anything.
      - name: Run token-consumer gate (authorable but unread tokens)
        if: ${{ !cancelled() }}
        run: python dev/token_consumer_gate.py

      # The SINGULARITY gate. Every check above polices values INSIDE the design
      # system. This one polices how many design systems there are.
      #
      # Eight overlapping ways to answer "what colour/size should this be?" had
      # accumulated, because each new one was added beside the last rather than
      # in place of it, and nothing ever failed for having two. `sx::recipes`
      # was a complete second recipe engine whose only consumer was a settings
      # gallery captioned "proof the new styling system is wired into the app".
      #
      # Deleting it is not durable on its own — only a census that objects when
      # it grows back is. Legacy systems are ceilings (may shrink, never grow),
      # canonical ones are floors (a migration is not finished by abandoning
      # the destination), deleted ones must stay at zero.
      - name: Run single-system gate (parallel styling systems)
        if: ${{ !cancelled() }}
        run: python dev/single_system_gate.py

      # The RELATIONSHIP-WITHIN-A-LADDER gate. control_size_lint asks whether a
      # height is a token; this asks whether all rungs of one ladder scale
      # together. A rung that forgets its override multiplier is a legal token,
      # renders identically at every default (Standard is 1.0x everywhere), and
      # breaks away only when a user changes the setting — at which point it can
      # land on top of its neighbour. `gap_xs_mid` did exactly that at Tight
      # (3.0 / 6.0 / 6.0), and `stroke_extra_thick`/`stroke_heavy` were not
      # tokens at all, just literals in a "pure constants" block with 8 callers.
      - name: Run ladder gate (rungs that do not scale together)
        if: ${{ !cancelled() }}
        run: python dev/ladder_gate.py

      # The PROMISE gate. A slider is a promise that this number controls that
      # pixel. 59 of the inspector's 123 `tokens.*` sliders had no `dt_*!`
      # consumer at all — they moved, they saved, and nothing changed. That is
      # worse than a missing control: a missing slider says the system doesn't
      # support something, a dead one says it does and that you're holding it
      # wrong. `stroke.heavy` shipped a live "heavy (2.5)" slider that nothing
      # read, a few files from an accessor hardcoding that same 2.5.
      #
      # Ceiling only; it may fall, never rise.
      - name: Run inspector-slider gate (controls that control nothing)
        if: ${{ !cancelled() }}
        run: python dev/inspector_slider_gate.py

      # The HARDWIRE gate. `ui_kit::style` is the design system's public
      # surface; an accessor there promises a theme can author that value. 27
      # of them were bare literals — `pub fn icon_md() -> f32 { 18.0 }` — a
      # literal wearing an accessor's clothes.
      #
      # It is the most durable kind of hardwire because every other check here
      # passes it: the call-site lints see a proper accessor and are satisfied
      # (the call site IS correct), token_consumer_gate only enumerates
      # frame_tokens()-backed accessors so it never considers them, and
      # ladder_gate compares multipliers across a ladder — one where every rung
      # is hardcoded is perfectly consistent. So the system could report full
      # compliance while icon scale, leading and display type were unauthorable
      # by any theme. Budget is 0.
      - name: Run hardwire gate (accessors that return literals)
        if: ${{ !cancelled() }}
        run: python dev/hardwire_gate.py

      # Cascade gate. Fixing the hardwire gate above created its own defect
      # class: a token gets a StyleSystem field, a TokenSnapshot field and an
      # accessor — and is then sourced DIRECTLY (`al.whisper`) instead of
      # through the override / DesignTokens tiers its siblings pass through.
      # It compiles, renders identically, exports and round-trips green, and
      # does not move when you drag its inspector slider. Eleven fields across
      # three groups had this, all from the same habit, and no other check
      # here could see it — hardwire is satisfied (the accessor is real),
      # token_consumer is satisfied (begin_frame DOES read the field), and
      # ladder_gate asks about scale multipliers, not cascade tiers. The rule
      # is all-siblings-or-none, exactly like ladder_gate's.
      - name: Run cascade gate (siblings that skip the cascade)
        if: ${{ !cancelled() }}
        run: python dev/cascade_gate.py

      # The ratchet's test-code filter, checked separately because its failure
      # mode is "quietly stops filtering". It did exactly that twice: once
      # handed git-bash MSYS paths native Windows Python cannot open, once when
      # an edit silently failed to apply. Both times the only symptom was the
      # baseline moving by the number of test literals in a few files, which
      # reads like real drift and invites a blind re-baseline.
      - name: Self-test the ratchet's test-code filter
        if: ${{ !cancelled() }}
        run: python dev/strip_test_hits.py --selftest

      # Adoption floors for the declarative cascading layer, plus a ceiling on
      # the cursor walks it replaces.
      #
      # Every other check here is a ceiling on a bad pattern. Ceilings keep a
      # system from getting worse; they cannot keep one from being built and
      # then ignored. `sx::recipes` passed every ceiling in this repo right up
      # until it was deleted, because a system nobody calls produces no
      # violations — and `ui_kit/cascade` is at the same risk for the same
      # reason: it is additive, so with no scope open nothing changes. That is
      # what makes adoption safe AND what makes abandonment invisible.
      - name: Run cascade-adoption gate (floors + cursor-walk ceiling)
        if: ${{ !cancelled() }}
        run: python dev/cascade_adoption_gate.py
