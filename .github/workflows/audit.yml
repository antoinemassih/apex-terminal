name: Dependency Audit

# Runs `cargo audit` against the RUSTSEC advisory database — catches known
# CVEs in dependencies. The weekly schedule matters: a new advisory can land
# against a crate the lockfile hasn't changed, so audit on a timer too.

on:
  pull_request:
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'apex-native/Cargo.lock'
      - '.github/workflows/audit.yml'
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'   # every Monday 09:00 UTC

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Plain `cargo audit` fails the job on an active vulnerability advisory;
      # unmaintained / yanked warnings are reported but do not fail (the tree
      # carries known dep debt tracked in docs/AUDIT.md — add `--deny warnings`
      # once that is paid down).
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
